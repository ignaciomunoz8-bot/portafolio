<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSolutions - Soluciones Tecnológicas</title>
    
    <!-- LIBRERÍAS EXTERNAS (Necesarias para que funcione sin instalar nada) -->
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (Para entender código moderno) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS (Para el diseño) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Estilos extra -->
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Aquí se montará la aplicación -->
    <div id="root"></div>

    <!-- CÓDIGO DE LA APLICACIÓN -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- 1. DATOS SIMULADOS (BASE DE DATOS) ---
        const PRODUCTS_DB = [
            { id: 1, name: "Laptop Enterprise X1", price: 1200, category: "Computación", img: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400&q=80" },
            { id: 2, name: "Smartphone Pro Max", price: 950, category: "Móviles", img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&q=80" },
            { id: 3, name: "Auriculares Studio", price: 200, category: "Audio", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80" },
            { id: 4, name: "Monitor 4K Ultra", price: 400, category: "Computación", img: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=400&q=80" },
            { id: 5, name: "Teclado Mecánico", price: 120, category: "Accesorios", img: "https://images.unsplash.com/photo-1587829741301-dc798b91a603?w=400&q=80" },
            { id: 6, name: "Tablet Gráfica", price: 350, category: "Diseño", img: "https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=400&q=80" },
            { id: 7, name: "Cámara DSLR", price: 850, category: "Fotografía", img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=400&q=80" },
            { id: 8, name: "Smart Watch V2", price: 180, category: "Accesorios", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80" }
        ];

        // --- 2. COMPONENTES ---

        // Componente: Barra de Navegación
        const Navbar = ({ user, setPage, cartCount, onLogout }) => (
            <nav className="bg-slate-900 text-white sticky top-0 z-50 shadow-lg">
                <div className="container mx-auto px-6 py-4 flex justify-between items-center">
                    <div className="text-2xl font-bold cursor-pointer flex items-center gap-2" onClick={() => setPage('home')}>
                        <span className="text-blue-400">Tech</span>Corp
                    </div>
                    
                    <div className="hidden md:flex gap-8 font-medium">
                        <button onClick={() => setPage('home')} className="hover:text-blue-400 transition">Inicio</button>
                        <button onClick={() => setPage('catalog')} className="hover:text-blue-400 transition">Catálogo</button>
                        <button onClick={() => setPage('contact')} className="hover:text-blue-400 transition">Contacto</button>
                    </div>

                    <div className="flex gap-4 items-center">
                        <button onClick={() => setPage('cart')} className="relative p-2 hover:bg-slate-800 rounded-full transition">
                            <span className="text-xl">🛒</span>
                            {cartCount > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-xs rounded-full px-2 py-0.5 animate-bounce">{cartCount}</span>}
                        </button>
                        
                        {user ? (
                            <div className="flex items-center gap-3 pl-4 border-l border-slate-700">
                                <span className="text-sm text-gray-300 hidden sm:block">Hola, {user.name}</span>
                                <button onClick={onLogout} className="text-sm bg-red-600 hover:bg-red-700 px-3 py-1 rounded transition">Salir</button>
                            </div>
                        ) : (
                            <button onClick={() => setPage('login')} className="bg-blue-600 px-5 py-2 rounded font-bold hover:bg-blue-700 transition">Ingresar</button>
                        )}
                    </div>
                </div>
            </nav>
        );

        // Componente: Login
        const Login = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                // Validación simulada
                if (email === "admin@demo.com" && pass === "1234") {
                    onLogin({ name: "Admin User", email });
                } else {
                    setError("Error: Usa admin@demo.com y clave 1234");
                }
            };

            return (
                <div className="flex justify-center items-center min-h-[70vh] fade-in px-4">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
                        <h2 className="text-3xl font-bold mb-2 text-center text-slate-800">Bienvenido</h2>
                        <p className="text-center text-gray-500 mb-8">Ingresa a tu cuenta corporativa</p>
                        
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Correo Corporativo</label>
                                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 transition" placeholder="admin@demo.com" required />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                                <input type="password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 transition" placeholder="1234" required />
                            </div>
                            {error && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 text-sm">{error}</div>}
                            <button type="submit" className="w-full bg-slate-900 text-white py-3 rounded-lg font-bold hover:bg-slate-800 transition transform hover:scale-[1.02]">Iniciar Sesión</button>
                        </form>
                        <div className="mt-6 text-center text-xs text-gray-400 bg-gray-50 p-2 rounded">
                            <p>Credenciales Demo:</p>
                            <p>User: <b>admin@demo.com</b> | Pass: <b>1234</b></p>
                        </div>
                    </div>
                </div>
            );
        };

        // Componente: Catálogo
        const Catalog = ({ addToCart }) => {
            const [filter, setFilter] = useState("Todos");
            const categories = ["Todos", ...new Set(PRODUCTS_DB.map(p => p.category))];

            const filtered = filter === "Todos" ? PRODUCTS_DB : PRODUCTS_DB.filter(p => p.category === filter);

            return (
                <div className="container mx-auto p-6 fade-in min-h-screen">
                    <div className="text-center mb-10">
                        <h2 className="text-4xl font-bold text-slate-800 mb-4">Catálogo de Productos</h2>
                        <p className="text-gray-600">Lo mejor en tecnología para tu empresa</p>
                    </div>
                    
                    {/* Filtros */}
                    <div className="flex flex-wrap justify-center gap-2 mb-10">
                        {categories.map(cat => (
                            <button key={cat} onClick={() => setFilter(cat)}
                                className={`px-6 py-2 rounded-full text-sm font-medium transition ${filter === cat ? 'bg-slate-900 text-white shadow-lg' : 'bg-white text-gray-600 hover:bg-gray-100'}`}>
                                {cat}
                            </button>
                        ))}
                    </div>

                    {/* Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                        {filtered.map(product => (
                            <div key={product.id} className="bg-white rounded-xl shadow-sm hover:shadow-2xl transition duration-300 overflow-hidden group">
                                <div className="relative overflow-hidden h-48">
                                    <img src={product.img} alt={product.name} className="w-full h-full object-cover transform group-hover:scale-110 transition duration-500" />
                                </div>
                                <div className="p-5">
                                    <div className="text-xs font-bold text-blue-500 uppercase tracking-wide mb-1">{product.category}</div>
                                    <h3 className="text-lg font-bold text-slate-800 mb-2 truncate">{product.name}</h3>
                                    <div className="flex justify-between items-center mt-4">
                                        <span className="text-xl font-bold text-slate-900">${product.price}</span>
                                        <button onClick={() => addToCart(product)} className="bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700 transition shadow-md">
                                            + 
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Componente: Carrito
        const Cart = ({ cart, removeFromCart, clearCart }) => {
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            return (
                <div className="container mx-auto p-6 fade-in max-w-5xl min-h-screen">
                    <h2 className="text-3xl font-bold mb-8 text-slate-800">Carrito de Compras</h2>
                    
                    {cart.length === 0 ? (
                        <div className="bg-white p-10 rounded-lg shadow text-center">
                            <p className="text-gray-500 text-xl">Tu carrito está vacío.</p>
                        </div>
                    ) : (
                        <div className="flex flex-col lg:flex-row gap-8">
                            <div className="flex-1 space-y-4">
                                {cart.map((item, index) => (
                                    <div key={index} className="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                                        <div className="flex items-center gap-4">
                                            <img src={item.img} className="w-16 h-16 rounded object-cover" />
                                            <div>
                                                <h4 className="font-bold text-slate-800">{item.name}</h4>
                                                <p className="text-gray-500 text-sm">${item.price}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => removeFromCart(index)} className="text-red-500 hover:text-red-700 text-sm font-semibold">Eliminar</button>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="lg:w-96">
                                <div className="bg-white p-6 rounded-lg shadow-lg border border-gray-100 sticky top-24">
                                    <h3 className="text-xl font-bold mb-6">Resumen del Pedido</h3>
                                    <div className="flex justify-between mb-2 text-gray-600"><span>Subtotal</span><span>${total}</span></div>
                                    <div className="flex justify-between mb-6 text-gray-600"><span>IVA (19%)</span><span>${(total * 0.19).toFixed(2)}</span></div>
                                    <div className="border-t pt-4 flex justify-between text-2xl font-bold text-slate-900 mb-6">
                                        <span>Total</span>
                                        <span>${(total * 1.19).toFixed(2)}</span>
                                    </div>
                                    <button onClick={() => { alert('Compra realizada con éxito!'); clearCart(); }} className="w-full bg-green-600 text-white py-4 rounded-lg font-bold hover:bg-green-700 transition shadow-lg mb-3">
                                        Pagar Ahora
                                    </button>
                                    <button onClick={clearCart} className="w-full text-gray-500 text-sm hover:text-red-500">Vaciar Carrito</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Componente: Footer
        const Footer = () => (
            <footer className="bg-slate-900 text-gray-400 py-12 mt-auto">
                <div className="container mx-auto px-6 grid md:grid-cols-4 gap-8">
                    <div className="col-span-1 md:col-span-2">
                        <h4 className="text-white text-xl font-bold mb-4">TechSolutions Corp.</h4>
                        <p className="text-sm leading-relaxed max-w-xs">Líderes en importación y distribución de hardware empresarial. Conectando tu negocio con el futuro desde 2010.</p>
                    </div>
                    <div>
                        <h4 className="text-white font-bold mb-4">Empresa</h4>
                        <ul className="space-y-2 text-sm">
                            <li><a href="#" className="hover:text-blue-400 transition">Sobre Nosotros</a></li>
                            <li><a href="#" className="hover:text-blue-400 transition">Sostenibilidad</a></li>
                            <li><a href="#" className="hover:text-blue-400 transition">Trabaja con nosotros</a></li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="text-white font-bold mb-4">Ayuda</h4>
                        <ul className="space-y-2 text-sm">
                            <li><a href="#" className="hover:text-blue-400 transition">Soporte Técnico</a></li>
                            <li><a href="#" className="hover:text-blue-400 transition">Garantías</a></li>
                            <li><a href="#" className="hover:text-blue-400 transition">Contacto</a></li>
                        </ul>
                    </div>
                </div>
                <div className="border-t border-slate-800 mt-10 pt-6 text-center text-xs">
                    &copy; 2025 TechSolutions Corp. Todos los derechos reservados.
                </div>
            </footer>
        );

        // --- 3. LÓGICA PRINCIPAL (APP) ---
        const App = () => {
            // Estados globales
            const [view, setView] = useState('home');
            const [user, setUser] = useState(null);
            const [cart, setCart] = useState([]);

            // Funciones del carrito
            const addToCart = (product) => {
                setCart([...cart, product]);
                // Pequeña notificación visual (alert simple)
                alert(`Agregado: ${product.name}`);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
            };

            const clearCart = () => setCart([]);

            // Router simple
            const renderContent = () => {
                switch(view) {
                    case 'home':
                        return (
                            <div className="fade-in">
                                <div className="bg-gradient-to-r from-slate-900 to-slate-800 text-white py-24 px-6 text-center">
                                    <h1 className="text-5xl font-bold mb-6">Tecnología de Punta</h1>
                                    <p className="text-xl text-gray-300 mb-8">Equipa tu empresa con el hardware más avanzado del mercado.</p>
                                    <button onClick={() => setView('catalog')} className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-full font-bold transition shadow-lg transform hover:scale-105">Ver Productos</button>
                                </div>
                                <div className="container mx-auto py-16 px-6">
                                    <h3 className="text-2xl font-bold text-center mb-10 text-slate-800">¿Por qué elegirnos?</h3>
                                    <div className="grid md:grid-cols-3 gap-8 text-center">
                                        <div className="p-6 border rounded-xl hover:shadow-md transition"><div className="text-4xl mb-4">🚀</div><h4 className="font-bold mb-2">Envíos Express</h4><p className="text-sm text-gray-600">Despachos a todo el país en 24h.</p></div>
                                        <div className="p-6 border rounded-xl hover:shadow-md transition"><div className="text-4xl mb-4">🛡️</div><h4 className="font-bold mb-2">Garantía Extendida</h4><p className="text-sm text-gray-600">3 años de garantía en laptops.</p></div>
                                        <div className="p-6 border rounded-xl hover:shadow-md transition"><div className="text-4xl mb-4">💳</div><h4 className="font-bold mb-2">Pago Seguro</h4><p className="text-sm text-gray-600">Transacciones cifradas SSL.</p></div>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'login': return <Login onLogin={(u) => { setUser(u); setView('home'); }} />;
                    case 'catalog': return <Catalog addToCart={addToCart} />;
                    case 'cart': return <Cart cart={cart} removeFromCart={removeFromCart} clearCart={clearCart} />;
                    case 'contact': return <div className="container mx-auto p-10 text-center min-h-[50vh] flex flex-col justify-center">
                        <h2 className="text-3xl font-bold mb-4">Contáctanos</h2>
                        <p className="text-gray-600">Email: contacto@techcorp.com | Tel: +1 234 567 890</p>
                    </div>;
                    default: return null;
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <Navbar user={user} setPage={setView} cartCount={cart.length} onLogout={() => { setUser(null); setView('login'); setCart([]); }} />
                    <main className="flex-grow bg-slate-50">
                        {renderContent()}
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
